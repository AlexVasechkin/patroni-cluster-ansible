---
# ============================================================
# stanza.yml — инициализация stanza, первый бэкап, расписание.
#
# Выполняется ТОЛЬКО на repo-хосте (backup1) и ТОЛЬКО ПОСЛЕ того,
# как в кластере включены archive_mode / archive_command (иначе
# `pgbackrest check` не пройдёт — он гоняет тестовый WAL).
#
# Все команды pgbackrest здесь запускаются от пользователя
# pgbackrest (владелец репозитория и SSH-ключей).
# ============================================================

- name: "stanza-create — инициализируем stanza в репозитории"
  command: "pgbackrest --stanza={{ pgbackrest_stanza }} stanza-create"
  become_user: "{{ pgbackrest_repo_user }}"
  register: pgbackrest_stanza_create
  # stanza-create идемпотентна: повторный запуск на готовой stanza
  # завершается успешно ("completed successfully"), но ДОПОЛНИТЕЛЬНО печатает
  # "already exists ... and is valid" — значит ничего не создано. Поэтому
  # changed = успех И отсутствие пометки "already exists" (иначе таск всегда
  # рапортует changed на повторных прогонах). pgBackRest пишет лог в stdout.
  changed_when: >-
    'completed successfully' in
    (pgbackrest_stanza_create.stdout + pgbackrest_stanza_create.stderr)
    and 'already exists' not in
    (pgbackrest_stanza_create.stdout + pgbackrest_stanza_create.stderr)

- name: "check — проверяем archive_command и доступность репозитория"
  command: "pgbackrest --stanza={{ pgbackrest_stanza }} check"
  become_user: "{{ pgbackrest_repo_user }}"
  changed_when: false

- name: "Проверяем, есть ли уже полный бэкап"
  command: "pgbackrest --stanza={{ pgbackrest_stanza }} --output=json info"
  become_user: "{{ pgbackrest_repo_user }}"
  register: pgbackrest_info_json
  changed_when: false

- name: "Первый полный бэкап (только если бэкапов ещё нет)"
  command: "pgbackrest --stanza={{ pgbackrest_stanza }} --type=full backup"
  become_user: "{{ pgbackrest_repo_user }}"
  when: (pgbackrest_info_json.stdout | from_json | first).backup | length == 0

# ----------------------------------------------------------
# Расписание регулярных операций через cron (см. переменные
# pgbackrest_schedule_* в defaults). Дефолт под критичные данные:
#   full — еженедельно, diff — ежедневно, incr — ежечасно, verify — еженедельно.
# Непрерывная архивация WAL (archive_command) держит RPO ~секунды и
# обеспечивает PITR на любую точку между бэкапами; частый incr сокращает
# окно доигрывания WAL при восстановлении (меньше RTO).
# ----------------------------------------------------------
# Минимальный образ Ubuntu не содержит cron — ставим пакет и запускаем сервис,
# иначе модуль ansible.builtin.cron не найдёт бинарь crontab, а задания не пойдут.
- name: "Устанавливаем cron (для расписания бэкапов)"
  apt:
    name: cron
    state: present
    update_cache: true

- name: "Включаем и запускаем сервис cron"
  systemd:
    name: cron
    state: started
    enabled: true

- name: "Устанавливаем скрипт-обёртку для бэкапов/verify"
  template:
    src: pgbackrest-backup.sh.j2
    dest: /usr/local/bin/pgbackrest-backup.sh
    owner: "{{ pgbackrest_repo_user }}"
    group: "{{ pgbackrest_repo_user }}"
    mode: "0755"

- name: "cron: полный бэкап (full)"
  cron:
    name: "pgbackrest full backup"
    user: "{{ pgbackrest_repo_user }}"
    minute: "{{ pgbackrest_schedule_full.minute }}"
    hour: "{{ pgbackrest_schedule_full.hour }}"
    weekday: "{{ pgbackrest_schedule_full.weekday }}"
    job: "/usr/local/bin/pgbackrest-backup.sh full"

- name: "cron: разностный бэкап (diff)"
  cron:
    name: "pgbackrest diff backup"
    user: "{{ pgbackrest_repo_user }}"
    minute: "{{ pgbackrest_schedule_diff.minute }}"
    hour: "{{ pgbackrest_schedule_diff.hour }}"
    weekday: "{{ pgbackrest_schedule_diff.weekday }}"
    job: "/usr/local/bin/pgbackrest-backup.sh diff"

- name: "cron: инкрементальный бэкап (incr)"
  cron:
    name: "pgbackrest incr backup"
    user: "{{ pgbackrest_repo_user }}"
    minute: "{{ pgbackrest_schedule_incr.minute }}"
    hour: "{{ pgbackrest_schedule_incr.hour }}"
    weekday: "{{ pgbackrest_schedule_incr.weekday }}"
    job: "/usr/local/bin/pgbackrest-backup.sh incr"

- name: "cron: проверка целостности репозитория (verify)"
  cron:
    name: "pgbackrest verify"
    user: "{{ pgbackrest_repo_user }}"
    minute: "{{ pgbackrest_schedule_verify.minute }}"
    hour: "{{ pgbackrest_schedule_verify.hour }}"
    weekday: "{{ pgbackrest_schedule_verify.weekday }}"
    job: "/usr/local/bin/pgbackrest-backup.sh verify"
