---
# ============================================================
# Defaults для роли pgbackrest
#
# Переменные с наименьшим приоритетом — переопределяются в
# group_vars / host_vars / playbook. Общекластерные значения
# (имя stanza, репозиторный хост) заданы в group_vars/all.yml.
# ============================================================

# ----------------------------------------------------------
# Пути
# ----------------------------------------------------------
# Каталог репозитория на repo-хосте (смонтирован как Docker-том)
pgbackrest_repo_path: "/var/lib/pgbackrest"
# Каталог конфигурации
pgbackrest_config_dir: "/etc/pgbackrest"
pgbackrest_config_file: "/etc/pgbackrest/pgbackrest.conf"
# Каталог логов
pgbackrest_log_dir: "/var/log/pgbackrest"

# ----------------------------------------------------------
# OS-пользователь на БД-нодах, под которым работает pgBackRest.
# Это владелец data_dir PostgreSQL — иначе не прочитать файлы кластера.
# ----------------------------------------------------------
pgbackrest_db_os_user: "postgres"

# Каталог Unix-сокета PostgreSQL — pgBackRest подключается к локальному
# PG через него (pg_backup_start/stop). На Debian/Ubuntu PG слушает здесь.
pgbackrest_pg_socket_path: "/var/run/postgresql"

# ----------------------------------------------------------
# Политика хранения (ретеншн)
# ----------------------------------------------------------
# Тип ретеншна full-бэкапов:
#   count — держать N последних full (учебный дефолт pgBackRest);
#   time  — держать full за последние N ДНЕЙ (нужно финтеху/регуляторике —
#           гарантирует глубину PITR по времени, а не по числу бэкапов).
pgbackrest_retention_full_type: "time"
# При type=time — это КОЛИЧЕСТВО ДНЕЙ (не штук). 90 дней — разумный дефолт;
# уточните под своё регуляторное окно хранения.
pgbackrest_retention_full: 90
# Сколько diff-бэкапов держать (0/пусто — не ограничивать отдельно).
# Ограничивает разрастание diff внутри окна full.
pgbackrest_retention_diff: 14

# ----------------------------------------------------------
# Расписание бэкапов (cron на repo-хосте, пользователь pgbackrest).
# Поля — как в crontab; day/month по умолчанию '*'.
# Дефолт рассчитан на нагруженный кластер с критичными данными:
#   full   — раз в неделю (Вс 02:00)
#   diff   — ежедневно Пн–Сб (02:00)
#   incr   — ежечасно в :30 (кроме часа 02, чтобы не пересечься с full/diff)
#   verify — еженедельная проверка целостности репозитория (Пн 06:00)
# Непрерывная архивация WAL держит RPO ~секунды независимо от этого расписания;
# частый incr сокращает окно доигрывания WAL при restore (меньше RTO).
# ----------------------------------------------------------
pgbackrest_schedule_full:   { minute: "0",  hour: "2",        weekday: "0" }
pgbackrest_schedule_diff:   { minute: "0",  hour: "2",        weekday: "1-6" }
pgbackrest_schedule_incr:   { minute: "30", hour: "0-1,3-23", weekday: "*" }
pgbackrest_schedule_verify: { minute: "0",  hour: "6",        weekday: "1" }

# ----------------------------------------------------------
# Производительность
# ----------------------------------------------------------
# Тип сжатия репозитория: zst — быстрый и с хорошим коэффициентом.
pgbackrest_compress_type: "zst"

# Степень параллелизма (число процессов копирования/сжатия).
pgbackrest_process_max: 2

# Шифрование репозитория.
#   none        — учебно, без шифрования
#   aes-256-cbc — production; дополнительно нужен repo1-cipher-pass
pgbackrest_cipher_type: "none"

# ----------------------------------------------------------
# Логирование
# ----------------------------------------------------------
pgbackrest_log_level_console: "info"
pgbackrest_log_level_file: "detail"

# ----------------------------------------------------------
# SSH
# ----------------------------------------------------------
# Тип генерируемого ключа для связи repo-хост <-> db-ноды
pgbackrest_ssh_key_type: "ed25519"
