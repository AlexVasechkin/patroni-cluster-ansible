---
# ============================================================
# Defaults для роли pgbackrest
#
# Переменные с наименьшим приоритетом — переопределяются в
# group_vars / host_vars / playbook. Общекластерные значения
# (имя stanza, репозиторный хост) заданы в group_vars/all.yml.
# ============================================================

# ----------------------------------------------------------
# Пути
# ----------------------------------------------------------
# Каталог репозитория на repo-хосте (смонтирован как Docker-том)
pgbackrest_repo_path: "/var/lib/pgbackrest"
# Каталог конфигурации
pgbackrest_config_dir: "/etc/pgbackrest"
pgbackrest_config_file: "/etc/pgbackrest/pgbackrest.conf"
# Каталог логов
pgbackrest_log_dir: "/var/log/pgbackrest"

# ----------------------------------------------------------
# OS-пользователь на БД-нодах, под которым работает pgBackRest.
# Это владелец data_dir PostgreSQL — иначе не прочитать файлы кластера.
# ----------------------------------------------------------
pgbackrest_db_os_user: "postgres"

# Каталог Unix-сокета PostgreSQL — pgBackRest подключается к локальному
# PG через него (pg_backup_start/stop). На Debian/Ubuntu PG слушает здесь.
pgbackrest_pg_socket_path: "/var/run/postgresql"

# ----------------------------------------------------------
# Политика хранения и производительность
# ----------------------------------------------------------
# Сколько ПОЛНЫХ бэкапов держать. Более старые full (и связанные с ними
# diff/incr, и не нужный уже архив WAL) удаляются автоматически.
pgbackrest_retention_full: 2

# Тип сжатия репозитория: zst — быстрый и с хорошим коэффициентом.
pgbackrest_compress_type: "zst"

# Степень параллелизма (число процессов копирования/сжатия).
pgbackrest_process_max: 2

# Шифрование репозитория.
#   none        — учебно, без шифрования
#   aes-256-cbc — production; дополнительно нужен repo1-cipher-pass
pgbackrest_cipher_type: "none"

# ----------------------------------------------------------
# Логирование
# ----------------------------------------------------------
pgbackrest_log_level_console: "info"
pgbackrest_log_level_file: "detail"

# ----------------------------------------------------------
# SSH
# ----------------------------------------------------------
# Тип генерируемого ключа для связи repo-хост <-> db-ноды
pgbackrest_ssh_key_type: "ed25519"
