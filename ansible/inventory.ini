# ============================================================
# Ansible Inventory — Patroni Cluster
#
# Ansible подключается к контейнерам с хост-машины через SSH
# на проброшенных портах (2221–2225).
#
# ansible_host=127.0.0.1         — всё через localhost (проброс портов)
# ansible_port=22XX              — уникальный порт каждого контейнера
# ansible_user=ansible           — пользователь, созданный в Dockerfile
# ansible_ssh_private_key_file   — ключ из папки ../ssh/
# ansible_python_interpreter     — явно указываем python3
# ============================================================

# -----------------------------------------------------------
# Группа: etcd-ноды (3 штуки для кворума)
# -----------------------------------------------------------
[etcd]
etcd1 ansible_host=127.0.0.1 ansible_port=2221
etcd2 ansible_host=127.0.0.1 ansible_port=2222
etcd3 ansible_host=127.0.0.1 ansible_port=2223

# -----------------------------------------------------------
# Группа: PostgreSQL + Patroni
# -----------------------------------------------------------
[postgres]
pg1 ansible_host=127.0.0.1 ansible_port=2224
pg2 ansible_host=127.0.0.1 ansible_port=2225

# -----------------------------------------------------------
# Общие переменные для всех хостов
# -----------------------------------------------------------
[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=../ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
# Не проверять host-ключи (уже добавлены setup.sh)
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
