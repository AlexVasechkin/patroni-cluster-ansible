# ============================================================
# Переменные только для группы [etcd]
# ============================================================

# Директории etcd
etcd_data_dir: "/var/lib/etcd"
etcd_config_dir: "/etc/etcd"
etcd_bin_dir: "/usr/local/bin"

# URL для скачивания etcd
etcd_download_url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"

# Системный пользователь для etcd
etcd_user: "etcd"
etcd_group: "etcd"

# ----------------------------------------------------------
# Сеть и инициализация кластера
# ----------------------------------------------------------
# Адрес, на котором etcd слушает peer/client соединения.
# 0.0.0.0 — принимаем со всех интерфейсов.
etcd_listen_address: "0.0.0.0"

# Уникальный токен кластера — защищает от случайного слияния
# двух разных кластеров etcd.
etcd_initial_cluster_token: "patroni-etcd-cluster-01"

# Состояние при инициализации:
#   new      — создаём новый кластер (первый запуск)
#   existing — добавляем ноду в уже работающий кластер
etcd_initial_cluster_state: "new"

# ----------------------------------------------------------
# Тайминги Raft (мс) и логирование
# ----------------------------------------------------------
# Интервал между heartbeat-сообщениями лидера.
etcd_heartbeat_interval: 100
# Таймаут, после которого follower инициирует выборы лидера.
# Должен быть в 5-10 раз больше heartbeat-interval.
etcd_election_timeout: 1000
# Уровень логирования etcd.
etcd_log_level: "info"

# ----------------------------------------------------------
# TLS (mutual) — сертификаты на etcd-ноде
# Раздаёт playbook 01 из локального etcd_pki_dir. Флаг — etcd_tls_enabled (all).
#   server — клиентский канал (для Patroni/etcdctl)
#   peer   — межнодовый канал (raft), server+client auth
#   client — клиентский серт для локального etcdctl на самой ноде
# ----------------------------------------------------------
etcd_cert_dir: "/etc/etcd/certs"
etcd_ca_cert: "{{ etcd_cert_dir }}/ca.crt"
etcd_server_cert: "{{ etcd_cert_dir }}/{{ inventory_hostname }}-server.crt"
etcd_server_key: "{{ etcd_cert_dir }}/{{ inventory_hostname }}-server.key"
etcd_peer_cert: "{{ etcd_cert_dir }}/{{ inventory_hostname }}-peer.crt"
etcd_peer_key: "{{ etcd_cert_dir }}/{{ inventory_hostname }}-peer.key"
etcd_client_cert: "{{ etcd_cert_dir }}/client.crt"
etcd_client_key: "{{ etcd_cert_dir }}/client.key"

# Окружение для etcdctl: API v3 + (при TLS) cert-флаги через ETCDCTL_*.
# Используется во всех etcdctl-тасках плейбуков 01/05.
etcd_ctl_env: >-
  {{ {'ETCDCTL_API': '3'} | combine(
       {'ETCDCTL_CACERT': etcd_ca_cert,
        'ETCDCTL_CERT': etcd_client_cert,
        'ETCDCTL_KEY': etcd_client_key} if etcd_tls_enabled else {}) }}

# ----------------------------------------------------------
# Production-тюнинг
# ----------------------------------------------------------
# Автокомпакция истории ревизий — иначе backend-БД растёт бесконечно.
etcd_auto_compaction_mode: "periodic"
etcd_auto_compaction_retention: "1"    # часов
# Лимит размера backend-БД; при превышении etcd поднимает alarm и уходит в RO.
etcd_quota_backend_bytes: 8589934592   # 8 GiB
# Порог числа транзакций между снапшотами WAL.
etcd_snapshot_count: 10000
# Уровень метрик Prometheus на /metrics клиентского порта (basic|extensive).
etcd_metrics: "basic"
