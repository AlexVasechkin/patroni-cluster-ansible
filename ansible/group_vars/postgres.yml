# ============================================================
# Переменные только для группы [postgres]
# ============================================================

# Директории PostgreSQL и Patroni
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/data"
postgresql_config_dir: "/etc/postgresql/{{ postgresql_version }}/main"
patroni_config_dir: "/etc/patroni"
patroni_log_dir: "/var/log/patroni"

# Порты
postgresql_port: 5432
# patroni_api_port перенесён в all.yml (нужен pgbouncer-скрипту)

# Адрес, на котором слушают PostgreSQL и Patroni REST API.
# 0.0.0.0 — все интерфейсы (advertise-адрес берётся из patroni_node_ip).
postgresql_listen_address: "0.0.0.0"

# ----------------------------------------------------------
# pg_hba.conf — правила аутентификации при bootstrap
# ----------------------------------------------------------
# Метод аутентификации для host-правил. PG16 хранит пароли как
# scram-sha-256; playbook 03 меняет md5 → scram-sha-256 после bootstrap.
patroni_pg_hba_auth_method: "md5"
# Сеть, из которой разрешён доступ приложений (host all all).
patroni_pg_hba_app_cidr: "0.0.0.0/0"

# Режим watchdog (аппаратная защита от split-brain).
# off — для обучения; в production: automatic + softdog.
patroni_watchdog_mode: "off"

# Целевой метод аутентификации, на который playbook 03 переводит
# pg_hba после bootstrap (PG16 хранит пароли как scram-sha-256,
# несовместимо с pg_hba=md5).
patroni_pg_hba_scram_method: "scram-sha-256"

# Параметры PostgreSQL (можно переопределить для конкретного хоста)
postgresql_max_connections: 100
postgresql_shared_buffers: "256MB"
postgresql_wal_level: "replica"
postgresql_max_wal_senders: 10
postgresql_max_replication_slots: 10
postgresql_hot_standby: "on"
postgresql_wal_log_hints: "on"

# Параметры Patroni
patroni_ttl: 30
patroni_loop_wait: 10
patroni_retry_timeout: 30
patroni_maximum_lag_on_failover: 1048576  # 1MB
