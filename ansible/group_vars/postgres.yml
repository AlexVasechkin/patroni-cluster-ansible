# ============================================================
# Переменные только для группы [postgres]
# ============================================================

# Директории PostgreSQL и Patroni
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/data"
postgresql_config_dir: "/etc/postgresql/{{ postgresql_version }}/main"
patroni_config_dir: "/etc/patroni"
patroni_log_dir: "/var/log/patroni"

# TLS-сертификаты для подключения Patroni к etcd по https (mutual TLS).
# ca.crt + общий client.* раздаёт playbook 02 из локального etcd_pki_dir.
# Активны только при etcd_tls_enabled (all.yml).
patroni_etcd_cert_dir: "/etc/patroni/certs"
patroni_etcd_ca_cert: "{{ patroni_etcd_cert_dir }}/ca.crt"
patroni_etcd_client_cert: "{{ patroni_etcd_cert_dir }}/client.crt"
patroni_etcd_client_key: "{{ patroni_etcd_cert_dir }}/client.key"

# Basic-auth Patroni REST API. Защищает НЕбезопасные эндпоинты (POST/PUT/PATCH/
# DELETE: /restart, /switchover, /failover, /reload, изменение конфига).
# Read-only GET (/health, /leader, /replica, /patroni) остаются открытыми —
# их дёргают healthcheck'и, pgbouncer-скрипт и uri-таски плейбуков.
# Пустой username отключает auth. Пароль — из ansible-vault.
patroni_restapi_username: "patroni"
patroni_restapi_password: "{{ vault_patroni_restapi_password }}"

# Порты
postgresql_port: 5432
# patroni_api_port перенесён в all.yml (нужен pgbouncer-скрипту)

# Адрес, на котором слушают PostgreSQL и Patroni REST API.
# 0.0.0.0 — все интерфейсы (advertise-адрес берётся из patroni_node_ip).
postgresql_listen_address: "0.0.0.0"

# ----------------------------------------------------------
# pg_hba.conf — правила аутентификации при bootstrap
# ----------------------------------------------------------
# Метод аутентификации для host-правил. PG16 хранит пароли как
# scram-sha-256; playbook 03 меняет md5 → scram-sha-256 после bootstrap.
patroni_pg_hba_auth_method: "md5"
# Сеть, из которой разрешён доступ приложений (host all all).
patroni_pg_hba_app_cidr: "0.0.0.0/0"

# Режим watchdog (аппаратная защита от split-brain).
# off — для обучения; в production: automatic + softdog.
patroni_watchdog_mode: "off"

# Целевой метод аутентификации, на который playbook 03 переводит
# pg_hba после bootstrap (PG16 хранит пароли как scram-sha-256,
# несовместимо с pg_hba=md5).
patroni_pg_hba_scram_method: "scram-sha-256"

# Параметры PostgreSQL (можно переопределить для конкретного хоста)
postgresql_max_connections: 100
postgresql_shared_buffers: "256MB"
# logical — нужно для логической репликации и logical decoding on standby
# (создание логического слота на реплике). Смена уровня требует РЕСТАРТА.
postgresql_wal_level: "logical"
postgresql_max_wal_senders: 10
postgresql_max_replication_slots: 10
postgresql_hot_standby: "on"
# Реплика сообщает primary свой xmin, чтобы vacuum не удалял ещё нужные
# строки (в т.ч. catalog-строки). Без этого логический слот на standby
# инвалидируется (conflicting=true). Применяется reload'ом.
postgresql_hot_standby_feedback: "on"
postgresql_wal_log_hints: "on"

# ----------------------------------------------------------
# Слоты, которыми Patroni НЕ управляет (ignore_slots).
# Ручной логический слот на реплике (logical decoding on standby) не входит
# в набор слотов Patroni, и при реконсиляции (в т.ч. при смене лидера)
# Patroni может его дропнуть. Записи ниже защищают такие слоты: слот
# считается совпавшим, если совпали ВСЕ указанные атрибуты (name/type/
# database/plugin), незаданные — wildcard. Тут матчим по name+type, чтобы
# не завязываться на имя БД.
# ----------------------------------------------------------
patroni_ignore_slots:
  - name: my_slot
    type: logical

# ----------------------------------------------------------
# Параметры Patroni (DCS timing) — управляют скоростью failover.
#
# Два ограничения Patroni:
#   1) ttl >= 20               — жёсткий минимум (меньше Patroni зажимает до 20).
#   2) ttl >= loop_wait + 2*retry_timeout  — иначе транзиентная задержка etcd
#      дольше ttl уронит лидерский ключ → ложный failover.
# Рекомендуется также retry_timeout >= loop_wait.
#
# 20/5/5 — минимально быстрый failover, который разрешает Patroni:
#   обнаружение отказа лидера за ~ttl (20s), цикл раз в 5s,
#   запас по правилу 2: 20 >= 5 + 2*5 = 15 (5s слака под задержки etcd).
# Для нестабильной сети — увеличивайте ttl (напр. 30/10/10).
# ----------------------------------------------------------
patroni_ttl: 20
patroni_loop_wait: 5
patroni_retry_timeout: 5
patroni_maximum_lag_on_failover: 1048576  # 1MB
