# ============================================================
# Переменные, общие для всех хостов (НЕсекретные).
#
# Секреты вынесены в vault.yml (ansible-vault) и подставляются сюда
# через vault_*-переменные — см. patroni_*_password ниже.
# ============================================================

# Версия etcd для установки
etcd_version: "3.5.13"

# Версия PostgreSQL
postgresql_version: "16"

# Имя кластера Patroni (используется в конфигах и etcd)
patroni_cluster_name: "pg-cluster"

# Сеть кластера
cluster_subnet: "172.20.0.0/24"

# Хост для локальных healthcheck-проверок (wait_for / uri с самой ноды).
# Проверяем локально через loopback, не завязываясь на внешний IP.
healthcheck_local_host: "127.0.0.1"

# Как долго apt-кэш считается свежим (сек) — не обновляем чаще.
apt_cache_valid_time: 3600

# Порты etcd — единый источник для endpoints, конфига ноды и проверок.
#   client_port — клиентский API (Patroni, etcdctl)
#   peer_port   — репликация между etcd-нодами (raft)
etcd_client_port: 2379
etcd_peer_port: 2380

# ----------------------------------------------------------
# etcd TLS (mutual). Единый переключатель http↔https для всего стенда:
# etcd-конфиг, endpoints, etcdctl и etcd3-секция Patroni читают этот флаг.
# ВНИМАНИЕ: смена значения требует свежего bootstrap etcd (peer-членство
# хранит старую схему URL) — пересоздать etcd-контейнеры.
# ----------------------------------------------------------
etcd_tls_enabled: true
etcd_scheme: "{{ 'https' if etcd_tls_enabled else 'http' }}"

# Локальный каталог PKI на control-node (сюда playbook 01 генерирует CA и
# сертификаты; приватные ключи в .gitignore). playbook_dir = ansible/.
etcd_pki_dir: "{{ playbook_dir }}/certs"
# Срок действия и размер ключа выпускаемых сертификатов.
etcd_cert_valid_days: 3650
etcd_cert_key_size: 2048

# IP-адреса etcd-нод (используются в конфиге Patroni и etcd).
# Порты берём из etcd_client_port / etcd_peer_port, чтобы не дублировать.
etcd_nodes:
  - name: etcd1
    ip: "172.20.0.11"
    client_port: "{{ etcd_client_port }}"
    peer_port: "{{ etcd_peer_port }}"
  - name: etcd2
    ip: "172.20.0.12"
    client_port: "{{ etcd_client_port }}"
    peer_port: "{{ etcd_peer_port }}"
  - name: etcd3
    ip: "172.20.0.13"
    client_port: "{{ etcd_client_port }}"
    peer_port: "{{ etcd_peer_port }}"

# Строка подключения к etcd-кластеру (используется в Patroni и etcdctl).
# Строим из etcd_nodes, чтобы IP задавались в одном месте. Схема — из etcd_scheme.
etcd_endpoints: "{% for node in etcd_nodes %}{{ etcd_scheme }}://{{ node.ip }}:{{ node.client_port }}{% if not loop.last %},{% endif %}{% endfor %}"

# Пользователь и пароль PostgreSQL для репликации.
# Пароль хранится в vault.yml (vault_patroni_replication_password).
patroni_replication_user: "replicator"
patroni_replication_password: "{{ vault_patroni_replication_password }}"

# Суперпользователь PostgreSQL.
# Пароль хранится в vault.yml (vault_patroni_superuser_password).
patroni_superuser: "postgres"
patroni_superuser_password: "{{ vault_patroni_superuser_password }}"

# Порт Patroni REST API — используется и postgres-нодами и pgbouncer-скриптом
patroni_api_port: 8008

# ----------------------------------------------------------
# PgBouncer auth_query — общие переменные.
# Нужны и роли pgbouncer (хост pgbouncer1), и плейбуку 03 (PLAY 1.6 создаёт
# роль pgbouncer_auth + функцию user_lookup на pg1, вне контекста роли),
# поэтому живут в group_vars/all, а не в defaults роли.
# ----------------------------------------------------------
# true (по умолчанию) — пароли приложений НЕ хранятся в userlist.txt,
# PgBouncer получает SCRAM-verifier клиента через auth_query.
# false — fallback: пароли пользователей пишутся в userlist.txt.
pgbouncer_auth_query_enabled: true
# Ограниченная роль, под которой PgBouncer выполняет auth_query.
pgbouncer_auth_user: "pgbouncer_auth"
# Пароль роли — из ansible-vault (group_vars/all/vault.yml).
pgbouncer_auth_password: "{{ vault_pgbouncer_auth_password }}"

# PostgreSQL-ноды кластера (используются в скрипте pgbouncer-update-primary.sh
# и в конфиге pgBackRest на репозиторном хосте — pgN-host)
patroni_nodes:
  - name: pg1
    ip: "172.20.0.21"
  - name: pg2
    ip: "172.20.0.22"
  - name: pg3
    ip: "172.20.0.23"

# ============================================================
# pgBackRest — резервное копирование и PITR
# Общие параметры видны и pg-нодам (archive-push), и репозиторному
# хосту backup1 (backup/restore). Детали — в roles/pgbackrest/defaults.
# ============================================================

# Имя stanza — логическое имя кластера в pgBackRest.
# Совпадает с именем Patroni-кластера для наглядности.
pgbackrest_stanza: "{{ patroni_cluster_name }}"

# Репозиторный хост (inventory hostname из группы [backup]) и его IP.
pgbackrest_repo_host: "backup1"
pgbackrest_repo_host_ip: "172.20.0.40"

# Системный пользователь, от которого pgBackRest работает на репозитории.
# По SSH под ним ходят archive-push с pg-нод и backup/restore к pg-нодам.
pgbackrest_repo_user: "pgbackrest"

# Флаг включения архивации в шаблоне patroni.yml.j2.
#   false — свежий bootstrap (playbook 02) поднимается БЕЗ архивации.
#   true  — patroni.yml содержит archive_mode/archive_command и
#           create_replica_methods=pgbackrest.
# Playbook 04 включает архивацию на ЖИВОМ кластере через edit-config;
# после его успешного прогона выставьте здесь true, чтобы полный
# ре-деплой (01→02→03) тоже поднимался сразу с архивацией.
pgbackrest_enabled: false

# Максимальный интервал между переключениями WAL (ограничивает RPO).
pgbackrest_archive_timeout: "60s"

# ------------------------------------------------------------
# Выделенная РОЛЬ PostgreSQL для pgBackRest (НЕ суперпользователь postgres).
#
# Важно не путать ДВА разных «пользователя»:
#   - pgbackrest_repo_user (выше) — OS-пользователь на repo-хосте (SSH);
#   - pgbackrest_pg_user (здесь)  — РОЛЬ в PostgreSQL, под которой pgBackRest
#     делает libpq-подключение (pg_backup_start/stop, чтение настроек).
#
# pgBackRest подключается к PostgreSQL ТОЛЬКО через Unix-socket (TCP он к БД
# не умеет). Поэтому «без postgres» = отдельная non-superuser роль + scram по
# сокету; пароль pgBackRest берёт из ~/.pgpass OS-пользователя на ноде БД.
# Права роли — минимальные (см. roles/pgbackrest/tasks/pg_role.yml).
# ------------------------------------------------------------
pgbackrest_pg_user: "pgbackrest"
pgbackrest_pg_password: "{{ vault_pgbackrest_db_password }}"
# База, к которой подключается pgBackRest (pg-database). Обычно postgres.
pgbackrest_pg_database: "postgres"

# ------------------------------------------------------------
# Шифрование репозитория (client-side, aes-256-cbc).
#
# ВНИМАНИЕ: тип шифрования фиксируется при stanza-create и НЕ меняется на
# существующем репозитории. Включение/смена шифрования на уже созданном репо
# требует ПЕРЕИНИЦИАЛИЗАЦИИ (stanza-delete → stanza-create → новый full backup),
# т.е. потери старых бэкапов. См. docs/03-backup-encryption.md.
#
# Парольная фраза — только в vault. При её утере ВСЕ бэкапы нерасшифровываемы,
# поэтому хранить её ОТДЕЛЬНО от репозитория (секрет-менеджер/сейф).
# В модели выделенного repo-хоста ключ живёт ТОЛЬКО на backup1 — db-ноды его
# не видят (шифрует repo-хост), это дополнительный плюс к безопасности.
# ------------------------------------------------------------
pgbackrest_cipher_type: "aes-256-cbc"
pgbackrest_cipher_pass: "{{ vault_pgbackrest_cipher_pass }}"
