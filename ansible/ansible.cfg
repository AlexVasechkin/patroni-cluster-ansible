# ============================================================
# Конфигурация Ansible для стенда Patroni Cluster
# ============================================================
[defaults]
inventory = inventory.ini

# Файл с паролем от ansible-vault (сам файл НЕ коммитится — см. .gitignore).
# Альтернатива: убрать эту строку и запускать плейбуки с --ask-vault-pass.
vault_password_file = .vault_pass

# Не создавать .retry-файлы
retry_files_enabled = False
